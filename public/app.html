<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LifeOS AI</title>

<style>
:root{
  --bg:#07090d;
  --card:#10151d;
  --line:#26303d;
  --text:#f5f7fb;
  --muted:#8995a5;
  --lime:#c7ff5e;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:var(--bg);
 color:var(--text);
 height:100vh;
 overflow:hidden;
}


/* MENU */

.menu{
 position:fixed;
 top:0;
 left:-290px;
 width:270px;
 height:100%;
 background:rgba(16,21,29,.85);
 backdrop-filter:blur(20px);
 border-right:1px solid var(--line);
 transition:.35s;
 padding:25px;
 z-index:10;
}

.menu.active{
 left:0;
}

.menu h2{
 margin-bottom:25px;
}

.menu-item{
 padding:15px;
 margin-bottom:10px;
 border:1px solid var(--line);
 border-radius:15px;
 color:var(--muted);
}


/* TOP */

.top{
 height:70px;
 display:flex;
 align-items:center;
 padding:15px;
 border-bottom:1px solid var(--line);
}


.menu-btn{
 width:45px;
 height:45px;
 border-radius:50%;
 border:1px solid var(--line);
 background:
 linear-gradient(135deg,#ffffff20,#ffffff05);
 color:white;
 font-size:22px;
 backdrop-filter:blur(15px);
}


/* CHAT */

.chat{
 height:calc(100vh - 140px);
 overflow-y:auto;
 padding:20px;
 display:flex;
 flex-direction:column;
 gap:15px;
}


.message{
 max-width:80%;
 padding:15px;
 border-radius:18px;
 line-height:1.5;
}


.ai{
 background:var(--card);
 border:1px solid var(--line);
 align-self:flex-start;
}


.user{
 background:var(--lime);
 color:#111;
 align-self:flex-end;
}



/* INPUT */

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 padding:15px;
 background:linear-gradient(transparent,var(--bg));
}


.box{
 display:flex;
 gap:10px;
 background:var(--card);
 border:1px solid var(--line);
 padding:10px;
 border-radius:25px;
}


input{
 flex:1;
 background:none;
 border:0;
 outline:none;
 color:white;
 padding:10px;
}


button.send{
 background:var(--lime);
 border:0;
 border-radius:50%;
 width:45px;
 height:45px;
}

</style>

</head>


<body>


<div class="menu" id="menu">

<h2>LifeOS</h2>

<div class="menu-item">
📅 Día
</div>

<div class="menu-item">
📆 Semana
</div>

<div class="menu-item">
🗓 Mes
</div>

<div class="menu-item">
🚀 Proyectos
</div>

<div class="menu-item">
🎯 Metas
</div>

<div class="menu-item">
📈 Año
</div>

</div>



<div class="top">

<button class="menu-btn" onclick="toggleMenu()">
☰
</button>

</div>



<div class="chat" id="chat">


<div class="message ai">

Hola 👋 Soy LifeOS AI.

Cuéntame qué tienes que hacer hoy y crearé un plan inteligente para ti.

También puedo ayudarte con metas, proyectos y organización.

</div>


</div>




<div class="bottom">

<div class="box">

<input 
id="input"
placeholder="Planifica tu día con LifeOS..."
>


<button class="send" onclick="sendMessage()">
➤
</button>


</div>

</div>




<script>


function toggleMenu(){

document
.getElementById("menu")
.classList.toggle("active");

}



function sendMessage(){

let input=document.getElementById("input");

let text=input.value.trim();

if(!text)return;


addMessage(text,"user");


input.value="";


setTimeout(()=>{


addMessage(
"Perfecto. Analizaré tu día. Antes de crear el plan dime: ¿quieres organizarlo como día, semana, mes, meta o proyecto?",
"ai"
);


},700);


}



function addMessage(text,type){

let chat=document.getElementById("chat");


let div=document.createElement("div");

div.className="message "+type;

div.innerText=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}


</script>


</body>
  </html>
